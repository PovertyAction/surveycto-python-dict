[project]
name = "surveycto-python-dict"
version = "0.1.0"
description = "Pull a SurveyCTO form's XML and wide JSON over the API and build typed parquet, a variable dictionary and a per-variable PII signal."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "pandas>=2.3.0,<4",
    "pyarrow>=15.0.0",
    "python-dotenv>=1.0,<2",
    "presidio-analyzer>=2.2,<3",
]

[dependency-groups]
dev = ["pytest", "responses", "ruff"]

[project.scripts]
scto-pull  = "surveycto_python_dict.cli:pull_main"
scto-build = "surveycto_python_dict.cli:build_main"
scto-run   = "surveycto_python_dict.cli:run_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/surveycto_python_dict"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Lint config from ipa-python-template (org standard), py310 target.
[tool.ruff]
line-length = 88
fix = true
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "D", "UP", "SIM"]
ignore = [
    "W191", "E111", "E114", "E117", "D206", "D300", "E501",
    "D105", "D100", "D104", "SIM110", "D205", "D203", "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]

[tool.ruff.format]
docstring-code-format = true
