[project]
name = "surveycto-python-dict"
version = "0.1.0"
description = "Pull a SurveyCTO project's forms, submissions and server datasets over the API and build typed parquet, variable dictionaries, PII flags, cross-form lineage, a DuckDB database and an MCP server for cleaning."
authors = [{ name = "Innovations for Poverty Action" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.31,<3",
    "pandas>=2.3.0,<4",
    "pyarrow>=15.0.0",
    "python-dotenv>=1.0,<2",
    "presidio-analyzer>=2.2,<3",
    "es-core-news-lg",
    "en-core-web-lg",
    "mcp[cli]>=2.0.0,<3",
    "openpyxl>=3.1,<4",
    "duckdb>=1.1,<2",
]

[project.urls]
Repository = "https://github.com/PovertyAction/surveycto-python-dict"
Issues = "https://github.com/PovertyAction/surveycto-python-dict/issues"

[dependency-groups]
dev = ["codespell>=2.4.1", "pre-commit>=4.2.0", "pytest", "responses", "ruff"]
gliner = [
    "gliner>=0.2.26,<1.0.0",
    "gliner2-onnx[export]>=0.1.1",
    "gliner2[local]>=2.1.0",
    "protobuf>=7.36.2",
    "sentencepiece>=0.2.2",
]

spacy-small = [
    "es-core-news-sm",
    "en-core-web-sm",
    "es-core-news-md",
    "en-core-web-md",
    "xx-ent-wiki-sm",
]

[project.scripts]
scto-pull  = "surveycto_python_dict.cli:pull_main"
scto-build = "surveycto_python_dict.cli:build_main"
scto-run   = "surveycto_python_dict.cli:run_main"
scto-flow  = "surveycto_python_dict.cli:flow_main"
scto-mcp   = "surveycto_python_dict.mcp_server:main"
scto-survey = "surveycto_python_dict.survey:main"
scto-stats = "surveycto_python_dict.stats:main"
scto-codebook = "surveycto_python_dict.codebook:main"
scto-duckdb = "surveycto_python_dict.database:main"
scto-outputs = "surveycto_python_dict.cli:outputs_main"
scto-skill = "surveycto_python_dict.cli:skill_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/surveycto_python_dict"]

# The survey-expert skill ships in the wheel; scto-skill writes it into a project.
[tool.hatch.build.targets.wheel.force-include]
".claude/skills/survey-expert/SKILL.md" = "surveycto_python_dict/skill/SKILL.md"
".claude/skills/survey-expert/references" = "surveycto_python_dict/skill/references"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Lint config from ipa-python-template (org standard), py311 target.
[tool.ruff]
line-length = 88
fix = true
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "D", "UP", "SIM"]
ignore = [
    "W191", "E111", "E114", "E117", "D206", "D300", "E501",
    "D105", "D100", "D104", "SIM110", "D205", "D203", "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.format]
docstring-code-format = true

[tool.uv.sources]
es-core-news-lg = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_lg-3.8.0/es_core_news_lg-3.8.0-py3-none-any.whl" }
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
es-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
es-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl" }
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }
xx-ent-wiki-sm = { url = "https://github.com/explosion/spacy-models/releases/download/xx_ent_wiki_sm-3.8.0/xx_ent_wiki_sm-3.8.0-py3-none-any.whl" }

[tool.codespell]
builtin = "clear,rare,informal,usage,code,names"
ignore-words-list = "jupyter,ipa,ws,anc,stdio,dur,tread,whitelist,blacklist"
skip = "uv.lock"
