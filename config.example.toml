# Copy to config.toml (git-ignored) and set your form.
form_id = "my_form"
out_dir = "data/out"   # relative to this file; raw pulls go to <out_dir>/<form_id>/raw

[pii]
# Column or question names you reviewed and cleared; dataset columns as dataset.column.
whitelist = []
# Column or question names you reviewed as personal data; outranks publishable.
blacklist = []
